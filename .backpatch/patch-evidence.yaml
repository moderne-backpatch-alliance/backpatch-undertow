  note: "1098 tests at the patch commit, 14 of them skipped by the suite, 0 failed, 0 errors. Not in this report: core/src/test/java/io/undertow/testutils/DefaultServer.java (the JUnit runner the other tests run under, not a test class itself). Accepted verifier finding C (classes changed without a changed source): they are generated or inlined, never edited: the HTTP request and response parsers the build generates (HttpRequestParser$$generated, HttpResponseParser$$generated, which differ between two builds of one commit), classes that inline a changed class's constants, and JBoss Logging's generated loggers (UndertowLogger_$logger); benign by reading. Regression tests written for this port (ours; upstream ships none with its fix): DefaultEntitySizeLimitTestCase, with a test-support change to DefaultServer so the listeners get the Undertow options SimpleBlockingServerTestCase sets."
